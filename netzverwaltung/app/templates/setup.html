<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einrichten – Netzverwaltung</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="centered">
    <h1>Erstes Passwort setzen</h1>
    <p class="lede">
      Wer dieses Passwort kennt, kann Routing und Adressvergabe des gesamten
      Unterrichtsnetzes ändern. Mindestens 10 Zeichen.
    </p>
    {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
    <form method="post" action="/setup" class="panel">
      <label><span>Passwort</span>
        <input type="password" name="password" required autofocus autocomplete="new-password">
      </label>
      <label><span>Wiederholen</span>
        <input type="password" name="password2" required autocomplete="new-password">
      </label>
      <button class="btn" type="submit" style="width:100%">Festlegen</button>
    </form>
  </div>
</main>
</body>
</html>
