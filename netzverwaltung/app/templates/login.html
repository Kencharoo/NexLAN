<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Netzverwaltung</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="centered">
    <h1>Netzverwaltung</h1>
    <p class="lede">Verwaltung von DHCP und Routing des Unterrichtsnetzes.</p>
    {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="panel">
      <label><span>Passwort</span>
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button class="btn" type="submit" style="width:100%">Anmelden</button>
    </form>
  </div>
</main>
</body>
</html>
